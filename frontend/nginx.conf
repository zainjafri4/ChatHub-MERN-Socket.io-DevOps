# ─────────────────────────────────────────────────────────────
#  ChatHub — Nginx Configuration
#
#  Single entry point on port 80.
#  Nginx handles everything — no ALB needed:
#
#    /api/*       → proxy to backend (Express) at 127.0.0.1:5000
#    /socket.io/* → proxy to backend with WebSocket upgrade
#    /*           → serve React SPA static files
#
#  In ECS the frontend and backend containers share a host-mode
#  network, so 127.0.0.1:5000 reaches the backend directly.
# ─────────────────────────────────────────────────────────────

server {
    listen 80;
    server_name _;

    root  /usr/share/nginx/html;
    index index.html;

    # ── Compression ───────────────────────────────────────────
    gzip              on;
    gzip_vary         on;
    gzip_proxied      any;
    gzip_comp_level   6;
    gzip_min_length   1024;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml
        font/woff
        font/woff2;

    # ── Security headers ──────────────────────────────────────
    add_header X-Frame-Options        "SAMEORIGIN"                       always;
    add_header X-Content-Type-Options "nosniff"                          always;
    add_header X-XSS-Protection       "1; mode=block"                    always;
    add_header Referrer-Policy        "strict-origin-when-cross-origin"  always;

    # ── Health check ──────────────────────────────────────────
    location = /health {
        access_log  off;
        add_header  Content-Type text/plain;
        return      200 "healthy\n";
    }

    # ── REST API proxy → Express backend ─────────────────────
    location /api/ {
        proxy_pass         http://127.0.0.1:5000/api/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # ── Socket.io proxy → Express backend (WebSocket) ────────
    location /socket.io/ {
        proxy_pass         http://127.0.0.1:5000/socket.io/;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host       $host;
        proxy_set_header   X-Real-IP  $remote_addr;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 86400s; # keep long-lived socket connections alive
    }

    # ── Static assets: hashed filenames → immutable cache ─────
    location ~* \.(js|css|woff2?|ttf|eot|otf)$ {
        expires    1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    location ~* \.(png|jpg|jpeg|gif|ico|svg|webp)$ {
        expires    30d;
        add_header Cache-Control "public";
        access_log off;
    }

    # ── SPA fallback ──────────────────────────────────────────
    location / {
        try_files $uri $uri/ /index.html;

        location = /index.html {
            add_header Cache-Control "no-cache, no-store, must-revalidate";
            add_header Pragma        "no-cache";
            add_header Expires       "0";
        }
    }
}
